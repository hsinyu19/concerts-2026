<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style><title>2026 演唱會路線圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 交通路線圖。左 27% 固定路線圖（一場演唱會一站，四季四線色），右 73% 看板顯示目前這一站；≤700px 改單欄側線。 */
:root{
  --canvas:#f3f3f3; --ink:#202222; --hairline:#c5c7c8; --muted:#606467; --focus:#428bd1;
  --line-1:#176d9a; --line-2:#9d413b; --line-3:#3c785f; --line-4:#7959a1;
  --land:#e3e4e4;
  --sans:"PingFang TC","Noto Sans TC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"PingFang TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#17191b; --ink:#e8e9e9; --hairline:#414548; --muted:#b2b6b8; --land:#25292c; color-scheme:dark;
  --line-1:#3f93c2; --line-2:#c4655e; --line-3:#5ea283; --line-4:#9b7fc4;
}}
:root[data-theme="dark"]{
  --canvas:#17191b; --ink:#e8e9e9; --hairline:#414548; --muted:#b2b6b8; --land:#25292c; color-scheme:dark;
  --line-1:#3f93c2; --line-2:#c4655e; --line-3:#5ea283; --line-4:#9b7fc4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
a,button{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
button:hover,a:hover{opacity:.8}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;height:calc(58px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) max(26px,env(safe-area-inset-right,0px)) 0 max(26px,env(safe-area-inset-left,0px));
  background:var(--canvas);border-bottom:1px solid var(--hairline);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  font-size:13px;letter-spacing:.08em}
.topbar .name{font-weight:500}
.topbar .period{text-align:center;font-family:var(--mono);letter-spacing:0;color:var(--muted)}
.topbar .actions{justify-self:end;display:flex;gap:10px}
.btn{background:transparent;border:1px solid var(--hairline);border-radius:0;min-height:44px;padding:8px 15px;
  font:inherit;font-size:14px;letter-spacing:0;cursor:pointer}
.btn[aria-pressed="true"],.btn.danger-armed{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

/* Desktop shell */
.map{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:0;bottom:0;width:27%;
  padding:24px 24px 16px max(24px,env(safe-area-inset-left,0px));border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;gap:16px;overflow:hidden}
.map h1{margin:0;font-size:clamp(15px,1.4vw,22px);font-weight:500;letter-spacing:.04em;text-wrap:balance}
.map .tally{margin:4px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.route-wrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.route-wrap svg{display:block;width:100%;height:auto}
.route-wrap text{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.route-wrap text .artist{fill:var(--muted)}
.route-wrap a{cursor:pointer}
.route-wrap a[aria-current="true"] text{font-weight:700}
.route-wrap a[aria-current="true"] text .artist{fill:var(--ink)}
.legend{display:grid;grid-template-columns:1fr;gap:6px 10px;font-size:12px;margin:0;padding:0;list-style:none}
.legend li{border-left:5px solid var(--c);padding-left:7px;font-variant-numeric:tabular-nums}

.viewer{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:27%;right:0;bottom:0;
  padding:0 max(22px,env(safe-area-inset-right,0px)) 0 22px;display:grid;grid-template-rows:45px 1fr auto;min-width:0}
.readout{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;letter-spacing:.08em;border-bottom:1px solid var(--hairline)}
.readout .no{font-family:var(--mono);letter-spacing:0;font-variant-numeric:tabular-nums}
.readout .chapter{letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.readout .chapter::before{content:"";width:18px;height:5px;background:var(--c)}
.stage{padding:10px 0 16px;min-height:0;display:flex;flex-direction:column;gap:16px}
.visual{flex:1;min-height:0;position:relative;display:flex}
.stage .photo{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.stage .photo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.stage .caption{max-width:60ch}
.geo{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
.geo svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.geo .land{fill:var(--land);stroke:var(--hairline);stroke-width:1}
.geo .city{fill:var(--canvas);stroke:var(--muted);stroke-width:2}
.geo .city-label{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.geo .city-label.now{fill:var(--ink);font-weight:700}
.geo .where{font-family:var(--mono);font-size:13px;fill:var(--ink)}
.geo .where-note{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.stage:not(.no-photo) .geo{position:absolute;right:0;bottom:0;width:min(36%,320px);aspect-ratio:4/3;flex:none;
  background:var(--canvas);border:1px solid var(--hairline)}
.stage.no-photo .caption{padding-left:16px;border-left:5px solid var(--c)}
.artist-name{margin:0;font-size:clamp(22px,2.4vw,36px);font-weight:500;letter-spacing:.1em;line-height:1.5;text-wrap:balance}
.tour{margin:0;font-size:18px;font-weight:500}
.note{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{min-height:80px;border-top:1px solid var(--hairline);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;
  padding-block:10px;color:var(--muted);font-size:13px;line-height:1.7}
.meta dl{display:flex;flex-wrap:wrap;gap:4px 24px;margin:0}
.meta dl div{display:flex;gap:8px}
.meta dt{letter-spacing:.08em}
.meta dd{margin:0;color:var(--ink)}
.meta .tools{display:flex;gap:10px}
.rail{height:calc(58px + var(--n,1) * 90vh + 10vh)}

/* Empty & status */
.empty{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:27%;right:0;bottom:0;display:flex;align-items:center;
  padding-inline:max(22px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-right,0px))}
.empty-inner{max-width:46ch;padding-left:16px;border-left:5px dashed var(--hairline)}
.empty h2{margin:0 0 6px;font-size:18px;font-weight:500}
.empty p{margin:0 0 6px;color:var(--muted)}
.status{color:var(--muted);font-size:12px;margin:0}

/* Editor sheet */
.sheet{position:fixed;z-index:10;top:calc(58px + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(420px,100%);
  background:var(--canvas);border-left:1px solid var(--hairline);overflow-y:auto;
  padding:24px max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px}
.sheet h2{margin:0 0 16px;font-size:18px;font-weight:500}
.sheet form{display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label{font-size:13px;letter-spacing:.08em;color:var(--muted)}
.field input,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--hairline);border-radius:0;padding:8px 10px;width:100%;min-height:44px}
.field textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sheet .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sheet .err{color:var(--line-2);margin:0;font-size:13px}
.sheet .hint{color:var(--muted);font-size:12px;margin:0}

/* Mobile */
.mobile{display:none}
@media (max-width:700px){
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
    height:58px;grid-template-columns:1fr auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas)}
  .topbar .period{display:none}
  .map,.viewer,.rail,.empty{display:none!important}
  .mobile{display:block;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .mobile h1{margin:0;font-size:24px;font-weight:500;letter-spacing:.1em}
  .mobile .tally{margin:2px 0 16px;color:var(--muted);font-size:13px}
  .m-geo{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;height:36vh;min-height:220px;margin:0 0 32px;
    background:var(--canvas);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
  .m-list{display:grid;gap:0;margin:0;padding:0;list-style:none}
  .m-st{position:relative;padding:0 0 50px 24px;border-left:4px solid var(--c);margin-left:8px;min-width:0}
  .m-st:last-child{border-left-color:transparent}
  .m-st::before{content:"";position:absolute;left:-10.5px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--canvas);border:4px solid var(--c);box-sizing:content-box;transform:translateX(-0.5px)}
  .m-chapter{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0}
  .m-no{font-family:var(--mono);font-size:13px;margin:0}
  .m-st h2{margin:2px 0 0;font-size:18px;font-weight:500}
  .m-st .tour{font-size:14px;font-weight:400;color:var(--muted)}
  .m-st img{width:100%;height:auto;margin-top:10px;display:block}
  .m-meta{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
  .m-st .tools{display:flex;gap:10px;margin-top:10px}
  .m-empty{padding-left:16px;border-left:5px dashed var(--hairline)}
  .m-empty p{margin:0 0 6px;color:var(--muted)}
  .sheet{top:0;width:100%;border-left:0;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<header class="topbar">
  <span class="name">演唱會路線圖</span>
  <span class="period">2026.01 — 2026.12</span>
  <span class="actions"><button class="btn" id="addBtn" type="button" hidden>新增一站</button></span>
</header>

<aside class="map" aria-label="2026 路線圖">
  <div>
    <h1>2026 年的演唱會</h1>
    <p class="tally" id="tally">讀取中</p>
  </div>
  <div class="route-wrap" id="routeWrap"></div>
  <ul class="legend" id="legend"></ul>
  <p class="status" id="status" hidden></p>
</aside>

<main class="viewer" id="viewer" hidden>
  <div class="readout"><span class="no" id="rNo"></span><span class="chapter" id="rChapter"></span></div>
  <section class="stage" id="stage">
    <div class="visual">
      <div class="photo" id="photo" hidden><img id="photoImg" alt=""></div>
      <div class="geo" id="mapDesk" role="img" aria-label="目前所在位置地圖"></div>
    </div>
    <div class="caption">
      <h2 class="artist-name" id="vArtist"></h2>
      <p class="tour" id="vTour"></p>
      <p class="note" id="vNote"></p>
    </div>
  </section>
  <div class="meta">
    <dl id="vMeta"></dl>
    <span class="tools" id="vTools" hidden>
      <button class="btn" type="button" id="editBtn">編輯</button>
    </span>
  </div>
</main>

<section class="empty" id="empty">
  <div class="empty-inner">
    <h2 id="emptyTitle">路線還沒有站</h2>
    <p id="emptyText">每看完一場演唱會，就在這條線上加一站。一月到十二月分成四段，每一季一個線色。</p>
  </div>
</section>

<div class="rail" id="rail"></div>

<section class="mobile" id="mobile">
  <h1>2026 年的演唱會</h1>
  <p class="tally" id="mTally">讀取中</p>
  <div class="geo m-geo" id="mapMob" role="img" aria-label="目前所在位置地圖"></div>
  <ol class="m-list" id="mList"></ol>
</section>

<aside class="sheet" id="sheet" hidden aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">新增一站</h2>
  <form id="form" novalidate>
    <div class="field"><label for="fArtist">演出者</label><input id="fArtist" required maxlength="80" autocomplete="off"></div>
    <div class="field"><label for="fTour">巡演名稱</label><input id="fTour" maxlength="120" autocomplete="off"></div>
    <div class="two">
      <div class="field"><label for="fDate">日期</label><input id="fDate" type="date" min="2026-01-01" max="2026-12-31" required></div>
      <div class="field"><label for="fCity">城市</label><input id="fCity" maxlength="40" autocomplete="off"></div>
    </div>
    <div class="field"><label for="fVenue">場館</label><input id="fVenue" maxlength="80" autocomplete="off"></div>
    <div class="field"><label for="fSeat">座位</label><input id="fSeat" maxlength="60" autocomplete="off" placeholder="例：內場 B3 區 12 排"></div>
    <div class="field"><label for="fNote">心得</label><textarea id="fNote" maxlength="4000"></textarea></div>
    <div class="field"><label for="fPhoto">現場照片</label><input id="fPhoto" type="file" accept="image/*">
      <p class="hint" id="photoHint">選一張照片，會完整顯示不裁切。</p></div>
    <p class="err" id="formErr" hidden></p>
    <div class="row">
      <button class="btn" type="submit" id="saveBtn">儲存</button>
      <button class="btn" type="button" id="cancelBtn">取消</button>
      <button class="btn" type="button" id="deleteBtn" hidden>刪除這一站</button>
    </div>
  </form>
</aside>

<script>
(() => {
  const Q = [
    {name:"第一季", months:"一至三月", c:"var(--line-1)"},
    {name:"第二季", months:"四至六月", c:"var(--line-2)"},
    {name:"第三季", months:"七至九月", c:"var(--line-3)"},
    {name:"第四季", months:"十至十二月", c:"var(--line-4)"},
  ];
  const $ = id => document.getElementById(id);
  const SVGNS = "http://www.w3.org/2000/svg";
  let list = [], cur = 0, canEdit = false, db = null, assets = null, editingId = null, loaded = false;

  const quarter = d => Math.min(3, Math.floor((parseInt(d.slice(5,7),10) - 1) / 3)) || 0;
  const pad = n => String(n).padStart(2, "0");
  const md = d => d ? d.slice(5,7) + "·" + d.slice(8,10) : "--·--";
  const ymd = d => d ? d.replace(/-/g, ".") : "";
  const clip = (s, n) => { const a = Array.from(s || ""); return a.length > n ? a.slice(0, n).join("") + "…" : a.join(""); };
  const photoSrc = c => c.photo || "";

  /* ---------- Route map ---------- */
  function drawRoute() {
    const wrap = $("routeWrap"); wrap.textContent = "";
    if (!list.length) return;
    const lanes = [30, 54], top = 22, step = 27;
    const pts = list.map((c, i) => { const q = quarter(c.date); return {x: lanes[q % 2], y: top + i * step, q}; });
    const h = top + (list.length - 1) * step + 22;
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", `0 0 300 ${h}`);
    svg.setAttribute("role", "list");
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i-1], b = pts[i];
      const p = document.createElementNS(SVGNS, "path");
      const d = a.x === b.x ? `M${a.x} ${a.y}V${b.y}` : `M${a.x} ${a.y}V${b.y - Math.abs(b.x - a.x)}L${b.x} ${b.y}`;
      p.setAttribute("d", d); p.setAttribute("fill", "none");
      p.setAttribute("stroke", `var(--line-${a.q + 1})`); p.setAttribute("stroke-width", "5");
      p.setAttribute("stroke-linecap", "butt"); p.setAttribute("stroke-linejoin", "miter");
      svg.appendChild(p);
    }
    pts.forEach((pt, i) => {
      const c = list[i];
      const a = document.createElementNS(SVGNS, "a");
      a.setAttribute("href", "#"); a.setAttribute("role", "listitem"); a.dataset.i = i;
      a.setAttribute("aria-label", `第 ${i+1} 站 ${ymd(c.date)} ${c.artist || ""}`);
      const hit = document.createElementNS(SVGNS, "rect");
      hit.setAttribute("x", 0); hit.setAttribute("y", pt.y - 13); hit.setAttribute("width", 300); hit.setAttribute("height", 26);
      hit.setAttribute("fill", "transparent");
      const circ = document.createElementNS(SVGNS, "circle");
      circ.setAttribute("cx", pt.x); circ.setAttribute("cy", pt.y); circ.setAttribute("r", 6);
      circ.setAttribute("fill", "var(--canvas)"); circ.setAttribute("stroke", `var(--line-${pt.q + 1})`); circ.setAttribute("stroke-width", 3);
      const t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", 76); t.setAttribute("y", pt.y + 4.5);
      t.textContent = `${pad(i+1)} ${md(c.date)} `;
      const sp = document.createElementNS(SVGNS, "tspan");
      sp.setAttribute("class", "artist"); sp.textContent = clip(c.artist, 9);
      t.appendChild(sp);
      a.append(hit, circ, t);
      a.addEventListener("click", e => { e.preventDefault(); jumpTo(i); });
      svg.appendChild(a);
    });
    wrap.appendChild(svg);
  }

  function markCurrent() {
    document.querySelectorAll("#routeWrap a").forEach(a => {
      const on = +a.dataset.i === cur;
      a.setAttribute("aria-current", on ? "true" : "false");
      const circ = a.querySelector("circle"), q = quarter(list[+a.dataset.i].date);
      circ.setAttribute("fill", on ? `var(--line-${q + 1})` : "var(--canvas)");
      circ.setAttribute("stroke-width", on ? 5 : 3);
    });
    const el = document.querySelector('#routeWrap a[aria-current="true"]');
    if (el) {
      const wrap = $("routeWrap"), r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
      if (r.top < w.top || r.bottom > w.bottom) wrap.scrollTop += r.top - w.top - w.height / 2;
    }
  }

  function drawLegend() {
    const ul = $("legend"); ul.textContent = "";
    Q.forEach((q, i) => {
      const li = document.createElement("li");
      li.style.setProperty("--c", q.c);
      const n = list.filter(c => quarter(c.date) === i).length;
      li.textContent = `${q.name} ${q.months}　${n} 場`;
      ul.appendChild(li);
    });
  }

  /* ---------- Viewer ---------- */
  function showStation() {
    if (!list.length) return;
    const c = list[cur], q = quarter(c.date);
    $("rNo").textContent = `第 ${pad(cur+1)} 站　${ymd(c.date)}`;
    const ch = $("rChapter"); ch.textContent = `${Q[q].name}　${Q[q].months}`; ch.style.setProperty("--c", Q[q].c);
    const stage = $("stage"); stage.style.setProperty("--c", Q[q].c);
    const src = photoSrc(c);
    $("photo").hidden = !src; stage.classList.toggle("no-photo", !src);
    if (src) { $("photoImg").src = src; $("photoImg").alt = `${c.artist || ""} 現場照片`; }
    $("vArtist").textContent = c.artist || "未填演出者";
    $("vTour").textContent = c.tour || ""; $("vTour").hidden = !c.tour;
    $("vNote").textContent = c.note || ""; $("vNote").hidden = !c.note;
    const dl = $("vMeta"); dl.textContent = "";
    [["場館", c.venue], ["城市", c.city], ["座位", c.seat]].forEach(([k, v]) => {
      if (!v) return;
      const d = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = k; dd.textContent = v; d.append(dt, dd); dl.appendChild(d);
    });
    $("vTools").hidden = !canEdit;
    markCurrent();
    mapDesk.update(cur);
  }

  /* ---------- Mobile ---------- */
  function drawMobile() {
    const ol = $("mList"); ol.textContent = "";
    if (!list.length) {
      const li = document.createElement("li"); li.className = "m-empty";
      const p1 = document.createElement("p"); p1.textContent = loaded ? "路線還沒有站。" : "讀取中…";
      const p2 = document.createElement("p"); p2.textContent = canEdit ? "按右上角「新增一站」，記下第一場演唱會。" : "每看完一場演唱會，這條線就多一站。";
      li.append(p1, p2); ol.appendChild(li); return;
    }
    let lastQ = -1;
    list.forEach((c, i) => {
      const q = quarter(c.date), li = document.createElement("li");
      li.className = "m-st"; li.style.setProperty("--c", Q[q].c);
      if (q !== lastQ) { const ch = document.createElement("p"); ch.className = "m-chapter"; ch.textContent = `${Q[q].name}　${Q[q].months}`; li.appendChild(ch); lastQ = q; }

      if (!list.length) { this.ovl.textContent = ""; return; }
      const loc = this.locs(), dest = loc[i];
      const same = i === this.i;
      cancelAnimationFrame(this.raf); clearTimeout(this.timer);
      const from = this.pos, startView = this.view, prevI = this.i;
      this.i = i;
      const endView = homeFrame(dest);
      if (same || !from || !dest || !startView || reduceMotion() || !this.el.clientWidth) {
        this.view = endView; this.pos = dest;
        this.draw(loc, i, endView, dest, null);
        return;
      }
      const moving = from[0] !== dest[0] || from[1] !== dest[1];
      const midView = moving ? legFrame(from, dest) : endView;
      const zoomOut = Math.abs(midView.x1 - midView.x0 - (startView.x1 - startView.x0)) > 1 || Math.abs(midView.x0 - startView.x0) > 1;
      const zoomIn = Math.abs(endView.x1 - endView.x0 - (midView.x1 - midView.x0)) > 1 || Math.abs(endView.x0 - midView.x0) > 1;
      // phases: frame the leg → travel → settle on where you arrived
      const A = zoomOut ? 280 : 0, B = moving ? 520 : 0, C = zoomIn ? 280 : 0;
      const total = Math.max(A + B + C, 150);
      const forward = i > prevI;
      const t0 = performance.now();
      const step = now => {
        const e = Math.max(0, now - t0);
        let view, pos, trail = null;
        if (e < A) { view = lerpV(startView, midView, ease(e / A)); pos = from; }
        else if (e < A + B) {
          const k = ease((e - A) / B);
          view = midView; pos = [lerp(from[0], dest[0], k), lerp(from[1], dest[1], k)];
          if (forward) trail = [from, pos];
        } else if (e < total) { view = lerpV(midView, endView, C ? ease((e - A - B) / C) : 1); pos = dest; }
        else { view = endView; pos = dest; }
        if (e >= A + B && forward && moving) trail = [from, dest];
        this.view = view; this.pos = pos;
        this.draw(loc, i, view, pos, trail, forward ? i - 1 : i);
        if (e < total) this.raf = requestAnimationFrame(step);
      };
      this.raf = requestAnimationFrame(step);
      // a background tab pauses animation frames: still end up at the right place
      this.timer = setTimeout(() => { cancelAnimationFrame(this.raf); step(t0 + total + 1); }, total + 250);
    }
    draw(loc, i, v, pos, trail, doneUpTo = i) {
      const w = this.el.clientWidth, h = this.el.clientHeight;
      this.ovl.textContent = "";
      if (!w || !h) return;
      const s = Math.min(w / (v.x1 - v.x0), h / (v.y1 - v.y0));
      const ox = w / 2 - s * (v.x0 + v.x1) / 2, oy = h / 2 - s * (v.y0 + v.y1) / 2;
      this.svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      this.land.setAttribute("transform", `translate(${ox} ${oy}) scale(${s})`);
      const P = p => [ox + s * p[0], oy + s * p[1]];
      const leg = (a, b, q) => {
        const [ax, ay] = P(a), [bx, by] = P(b);
        this.ovl.appendChild(svgEl("line", {x1: ax, y1: ay, x2: bx, y2: by, stroke: `var(--line-${q + 1})`, "stroke-width": 3}));
      };
      // legs already travelled
      for (let j = 1; j <= Math.min(doneUpTo, i); j++) {
        const a = loc[j - 1], b = loc[j];
        if (a && b && (a[0] !== b[0] || a[1] !== b[1])) leg(a, b, quarter(list[j - 1].date));
      }
      if (trail && i > 0) leg(trail[0], trail[1], quarter(list[i - 1].date));
      // every city of the year
      const seen = new Map();
      list.forEach(c => { const p = lookup(c.city); if (p && !seen.has(cityKey(c.city))) seen.set(cityKey(c.city), {name: c.city.trim(), p: proj(p)}); });
      const here = loc[i];
      const arrived = pos && here && Math.abs(pos[0] - here[0]) < 0.01 && Math.abs(pos[1] - here[1]) < 0.01;
      seen.forEach(({name, p}) => {
        const [cx, cy] = P(p);
        if (cx < -40 || cy < -40 || cx > w + 40 || cy > h + 40) return;
        const isHere = arrived && p[0] === here[0] && p[1] === here[1];
        if (!isHere) this.ovl.appendChild(svgEl("circle", {cx, cy, r: 4, class: "city"}));
        const t = svgEl("text", {x: cx + 14, y: cy + 4, class: "city-label" + (isHere ? " now" : "")});
        t.textContent = name;
        this.ovl.appendChild(t);
      });
      // you
      const c = list[i], col = `var(--line-${quarter(c.date) + 1})`;
      if (pos) {
        const [hx, hy] = P(pos);
        this.ovl.appendChild(svgEl("circle", {cx: hx, cy: hy, r: 13, fill: "none", stroke: col, "stroke-width": 2}));
        this.ovl.appendChild(svgEl("circle", {cx: hx, cy: hy, r: 7, fill: col, stroke: "var(--canvas)", "stroke-width": 2}));
      }
      const t = svgEl("text", {x: 10, y: 20, class: "where"});
      const name = lookup(c.city) ? c.city.trim() : "上一站";
      t.textContent = `${arrived || !pos ? "你在" : "前往"} ${here ? name : "—"}　${pad(i + 1)}/${pad(list.length)}`;
      this.ovl.appendChild(t);
      if (!lookup(c.city)) {
        const n = svgEl("text", {x: 10, y: 38, class: "where-note"});
        n.textContent = c.city ? `地圖找不到「${clip(c.city, 10)}」，停在上一站` : "這一站沒填城市，停在上一站";
        this.ovl.appendChild(n);
      }
    }
  }
  const mapDesk = new MapView($("mapDesk"));
  const mapMob = new MapView($("mapMob"));
  let mobCur = 0;
  const isMobile = () => matchMedia("(max-width:700px)").matches;
  function mobileScroll() {
    if (!isMobile() || !list.length) return;
    const line = $("mapMob").getBoundingClientRect().bottom + 80;
    let k = 0;
    document.querySelectorAll("#mList .m-st").forEach((li, j) => { if (li.getBoundingClientRect().top <= line) k = j; });
    if (k !== mobCur || mobileScroll.force) { mobCur = k; mapMob.update(k); }
  }
  addEventListener("scroll", () => mobileScroll(), {passive: true});
  addEventListener("resize", () => { mobileScroll.force = true; mobileScroll(); mobileScroll.force = false; }, {passive: true});

  /* ---------- Render all ---------- */
  function render() {
    const cities = new Set(list.map(c => (c.city || "").trim()).filter(Boolean));
    const t = loaded ? (list.length ? `已看 ${list.length} 場　·　${cities.size} 個城市` : "還沒有任何一站") : "讀取中";
    $("tally").textContent = t; $("mTally").textContent = t;
    document.documentElement.style.setProperty("--n", Math.max(list.length, 1));
    $("viewer").hidden = !list.length; $("empty").hidden = !!list.length;
    $("emptyTitle").textContent = loaded ? "路線還沒有站" : "讀取中…";
    $("emptyText").textContent = canEdit
      ? "每看完一場演唱會，就按右上角「新增一站」。一月到十二月分成四段，每一季一個線色。"
      : "每看完一場演唱會，這條線就多一站。一月到十二月分成四段，每一季一個線色。";
    $("addBtn").hidden = !canEdit;
    drawRoute(); drawLegend(); drawMobile();
    cur = Math.min(cur, Math.max(list.length - 1, 0));
    onScroll(true);
    mobileScroll.force = true; mobileScroll(); mobileScroll.force = false;
  }

  /* ---------- Scroll rail ---------- */
  function idxFromScroll() {
    const h = innerHeight;
    return Math.max(0, Math.min(list.length - 1, Math.floor((scrollY + h * 0.35 - 58) / (0.9 * h))));
  }
  function onScroll(force) {
    if (!list.length) return;
    const i = idxFromScroll();
    if (i !== cur || force === true) { cur = i; showStation(); }
  }
  function jumpTo(i) {
    const h = innerHeight;
    window.scrollTo({top: Math.max(0, i * 0.9 * h + 58 - 0.35 * h + 1), behavior: "instant"});
    cur = i; showStation();
  }
  addEventListener("scroll", onScroll, {passive: true});
  addEventListener("resize", () => onScroll(true), {passive: true});

  /* ---------- Editor ---------- */
  let armed = false;
  function openSheet(c) {
    editingId = c ? c.id : null; armed = false;
    $("sheetTitle").textContent = c ? "編輯這一站" : "新增一站";
    $("fArtist").value = c?.artist || ""; $("fTour").value = c?.tour || "";
    $("fDate").value = c?.date || ""; $("fCity").value = c?.city || "";
    $("fVenue").value = c?.venue || ""; $("fSeat").value = c?.seat || "";
    $("fNote").value = c?.note || ""; $("fPhoto").value = "";
    $("photoHint").textContent = c?.photoId ? "已有一張照片；選新的會替換它。" : "選一張照片，會完整顯示不裁切。";
    $("fPhoto").closest(".field").hidden = !assets;
    $("formErr").hidden = true;
    const del = $("deleteBtn"); del.hidden = !c; del.textContent = "刪除這一站"; del.classList.remove("danger-armed");
    $("sheet").hidden = false; $("fArtist").focus();
  }
  function closeSheet() { $("sheet").hidden = true; editingId = null; }
  function fail(msg) { const e = $("formErr"); e.textContent = msg; e.hidden = false; }

  $("addBtn").addEventListener("click", () => openSheet(null));
  $("editBtn").addEventListener("click", () => list[cur] && openSheet(list[cur]));
  $("cancelBtn").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    if (!db) return fail("現在連不到資料，稍後再試。");
    const artist = $("fArtist").value.trim(), date = $("fDate").value;
    if (!artist) return fail("請填演出者。");
    if (!/^2026-\d\d-\d\d$/.test(date)) return fail("請選 2026 年內的日期。");
    const save = $("saveBtn"); save.disabled = true; save.textContent = "儲存中…";
    try {
      const prev = editingId ? list.find(c => c.id === editingId) : null;
      const body = {
        artist, date, tour: $("fTour").value.trim(), city: $("fCity").value.trim(),
        venue: $("fVenue").value.trim(), seat: $("fSeat").value.trim(), note: $("fNote").value.trim(),
        photoId: prev?.photoId || "", updatedAt: new Date().toISOString(),
      };
      const file = $("fPhoto").files[0];
      if (file && assets) {
        save.textContent = "上傳照片中…";
        const up = await assets.upload(file);
        body.photoId = up.id;
      }
      const ref = editingId ? db.collection("concerts").doc(editingId) : db.collection("concerts").doc();
      await ref.set(body);
      if (file && prev?.photoId && prev.photoId !== body.photoId) { try { await assets.delete(prev.photoId); } catch {} }
      const id = ref.id; closeSheet();
      setTimeout(() => { const i = list.findIndex(c => c.id === id); if (i >= 0) jumpTo(i); }, 50);
    } catch (err) {
      fail(err?.code === "quota_exceeded" ? "資料庫已滿，刪掉幾站再新增。" : "沒有存成功：" + (err?.message || "請稍後再試。"));
    } finally { save.disabled = false; save.textContent = "儲存"; }
  });

  $("deleteBtn").addEventListener("click", async () => {
    const b = $("deleteBtn");
    if (!armed) { armed = true; b.textContent = "再按一次確定刪除"; b.classList.add("danger-armed"); return; }
    const c = list.find(x => x.id === editingId); if (!c || !db) return;
    b.disabled = true;
    try {
      await db.collection("concerts").doc(c.id).delete();
      if (c.photoId && assets) { try { await assets.delete(c.photoId); } catch {} }
      closeSheet();
    } catch (err) { fail("沒有刪除成功：" + (err?.message || "請稍後再試。")); }
    finally { b.disabled = false; }
  });

  /* ---------- Boot ---------- */
  render();
  list = [{"artist": "Golden Disc Awards", "tour": "The 40th Golden Disc Awards", "date": "2026-01-10", "venue": "台北大巨蛋", "city": "台北", "seat": "", "note": "", "id": "c01", "photoId": ""}, {"artist": "NCT WISH", "tour": "1st CONCERT TOUR 'INTO THE WISH : Our WISH' IN TAIPEI", "date": "2026-02-28", "venue": "", "city": "台北", "seat": "", "note": "", "id": "c02", "photoId": ""}, {"artist": "TWICE", "tour": "\u003cTHIS IS FOR> WORLD TOUR IN TAIPEI", "date": "2026-03-21", "venue": "", "city": "台北", "seat": "", "note": "", "id": "c03", "photoId": ""}, {"artist": "NCT WISH", "tour": "1st CONCERT TOUR 'INTO THE WISH : Our WISH' IN KAOHSIUNG", "date": "2026-03-28", "venue": "", "city": "高雄", "seat": "", "note": "", "id": "c04", "photoId": ""}, {"artist": "CXM", "tour": "[DOUBLE UP] LIVE PARTY IN KAOHSIUNG", "date": "2026-04-25", "venue": "", "city": "高雄", "seat": "", "note": "", "id": "c05", "photoId": ""}, {"artist": "RIIZE", "tour": "中信兄弟「Channel B」棒球音樂祭", "date": "2026-05-24", "venue": "台北大巨蛋", "city": "台北", "seat": "", "note": "", "id": "c06", "photoId": ""}, {"artist": "NCT WISH", "tour": "【Ode to Love - The 1st Album】發行紀念公開簽名會 in TAIPEI", "date": "2026-06-12", "venue": "", "city": "台北", "seat": "", "note": "", "id": "c07", "photoId": ""}, {"artist": "RIIZE", "tour": "高雄啤酒節", "date": "2026-07-05", "venue": "", "city": "高雄", "seat": "", "note": "", "id": "c08", "photoId": ""}, {"artist": "TWICE", "tour": "\u003cTHIS IS FOR> WORLD TOUR FINALE in SEOUL", "date": "2026-07-11", "venue": "", "city": "首爾", "seat": "", "note": "", "id": "c09", "photoId": ""}, {"artist": "滅火器", "tour": "ON FIRE DAY 2026 滅火器台北小巨蛋演唱會", "date": "2026-07-18", "venue": "台北小巨蛋", "city": "台北", "seat": "", "note": "", "id": "c10", "photoId": ""}, {"artist": "DxS", "tour": "[SERENADE] ON STAGE-KAOHSIUNG", "date": "2026-07-25", "venue": "", "city": "高雄", "seat": "", "note": "", "id": "c11", "photoId": ""}, {"artist": "NCT WISH", "tour": "味全龍星光亞洲音樂祭", "date": "2026-08-01", "venue": "台北大巨蛋", "city": "台北", "seat": "", "note": "", "id": "c12", "photoId": ""}, {"artist": "NCT WISH", "tour": "2ND ANNIVERSARY FANMEETING IN TAIPEI", "date": "2026-09-05", "venue": "", "city": "台北", "seat": "", "note": "", "id": "c13", "photoId": ""}, {"artist": "ITZY", "tour": "3RD WORLD TOUR \u003cTUNNEL VISION> in TAIPEI", "date": "2026-09-05", "venue": "", "city": "台北", "seat": "", "note": "", "id": "c14", "photoId": ""}];
  loaded = true; canEdit = false; render();
})();
</script>
